# Where each scheme of walton.yml comes from in the source text:
# Douglas Walton, Chris Reed and Fabrizio Macagno, Argumentation Schemes,
# Cambridge University Press 2008, chapter 9, "A User's Compendium of Schemes",
# pp. 308-346.
#
#   entry      the compendium's own number; a, b, c are added where one number
#              holds several schemas the book does not number separately (11.1
#              and 40). That gives 109 entries here. The book prints no total,
#              and 109 is this file's convention, not the book's count. The
#              README's figure of 106 is reached from it in two ways: by not
#              splitting 11.1 and 40 (106 distinct numbers), or by leaving out
#              the three numbers that print a scheme of their own and also
#              have sub-entries (4, 26 and 35; 106 leaves).
#   page       the page the entry starts on
#   questions  how many critical questions, rebuttal factors or undercutters the
#              compendium prints for the entry
#   shared     true when the book prints one list of questions after a group of
#              sub-schemes; the list is then counted for each of them
#   schemes    the ids in walton.yml (empty: the entry has no record)
#   status     other-content when the record filed under the entry holds a
#              different scheme; the note says which. Such an entry counts as
#              having no record of its own.
#
# The file is an inventory: it says where each record is filed. It does not
# certify that a record's premises, questions and conclusion match the book.
#
# Compiled on 2026-11-21 by reading the chapter. The file records facts about
# the book (numbers and pages) and reproduces none of its text.
# `go test` checks that every scheme of walton.yml appears here exactly once and
# that every entry has a record; `go run ./cmd/schemecheck -format source`
# prints the comparison with what each scheme models.

