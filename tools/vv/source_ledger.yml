# One row per record of walton.yml (PLAN.md 0.6), in the order of the file.
#
#   origin     book: a record of the compendium; upstream: one of the 24 records
#              of Carneades' own examples/AGs/YAML/walton.yml, which keep their
#              wording and ids and answer to the source they cite (D5, 5.5).
#              upstream gives the upstream id where the record was renamed.
#   entry      the compendium entry the record is filed under (as above)
#   cites      the record's own citation (meta.source) when it is not the
#              compendium of 2008
#   claim      what the record as a whole claims to be: transcription (says what
#              its source prints), correction (departs from the print where the
#              book itself supports it), interpretation (an executable reading
#              the print does not fix), policy (a choice of this application),
#              unchecked (not yet compared with its source)
#   stage      how far the row has been checked, in this order: mapped,
#              transcription-checked, interpretation-approved, questions-sorted,
#              example-passed. Gate L of the plan wants every released record at
#              example-passed.
#   questions  (from PLAN.md 5.1) each question the source prints, sorted:
#              premise (restates a premise, not modelled), assumption,
#              exception or rebuttal, with the statement that models it, or
#              standard (asks about the burden or the standard of proof, which
#              Carneades sets for an issue in the graph, not in a scheme). An
#              assumption or an exception without a statement is a gap (5.2).
#   changes    the changes made to the record, each with its plan item, page
#              and the kind of claim it makes
#
# `go test` checks that every record has one row and every row a record, that
# the entry agrees with the compendium above and the citation with
# walton.yml, that the upstream rows are the 24 records upstream ships, and
# that a row's stage has what it needs (sorted questions, a passing example).
