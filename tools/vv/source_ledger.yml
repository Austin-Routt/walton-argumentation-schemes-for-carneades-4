# Records of walton.yml taken over from Carneades' own examples/AGs/YAML/walton.yml
# that have no entry of their own in the compendium.
# exeption_to_rule and practical_reasoning1 were filed under 57 and 22.4 until
# those entries got records of their own (PLAN.md 3.8).
upstream_only: [abduction, credible_source, defeasible_modus_ponens, exeption_to_rule, practical_reasoning1, practical_reasoning2]

# Names introduced by PLAN.md Phase 3 (D6): a statement the library already had
# is reused when it says the same thing; otherwise the name measured in the
# first review's trial; a new record's names describe its statement in the
# book's words. A name found wrong is changed in the one migration of R2 (D4).
names:
  - {name: advocates_conclusion/3, page: 336, entry: "42", how: reused, from: "the premise of 43 and 45 that the person advocates the argument"}
  - {name: has/2, page: 322, entry: "21.2", how: reused, from: "variant 1's statement that a group has a quality (21.1)"}
  - {name: goal_of_agent/2, page: 323, entry: "22.2, 22.3, 22.4", how: trial, from: "goal premise in the first person, with the agent named"}
  - {name: conflicting_goals/2, page: 324, entry: "22.2, 22.3, 22.4", how: trial, from: "CQ5 of 22.2-22.3, CQ1 of 22.4; the other goals are not named, so the statement holds when some goal of the agent conflicts with the one given, which is what evidence for it has to show"}
  - {name: reapplication_sequence/3, page: 341, entry: "51", how: trial, from: "the reapplication sequence, with its two ends and the property"}
  - {name: addressee_of/2, page: 343, entry: "55.3", how: trial, from: "not printed: 'S must do A' needs S to be someone the rule applies to (an executable interpretation)"}
  - {name: excuse_or_overriding_duty/2, page: 343, entry: "55.3", how: trial, from: "rebuttal factor: S has an adequate excuse, or an overriding duty"}
  - {name: prohibited/1, page: 343, entry: "55.3", how: book, from: "A is prohibited"}
  - {name: must_not_do/2, page: 343, entry: "55.3", how: book, from: "S must not do A; a duty not to act, not the negation of a duty to act"}
  - {name: is_a/2, page: 342, entry: "54.1", how: trial, from: "A W is a D; renamed from is/2, which the rule engine executes"}
  - {name: claimed_exception/2, page: 340, entry: "50", how: book, from: "claim to exceptional status premise"}
  - {name: precedent_series/3, page: 340, entry: "50", how: book, from: "related cases premise: a sequence of similar pairs binds us by case-to-case consistency"}
