- record: exeption_to_rule
  origin: upstream
  upstream: precedent
  cites: Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, p. 148
  claim: interpretation
  stage: example-passed
  source_questions: 3
  questions:
  - n: 1
    kind: exception
    as: inapplicable_rule(R)
    note: 'p. 148 CQ1: does the established rule really apply to this case?'
  - n: 2
    kind: premise
    as: rule_of_case(R,C)
    note: 'p. 148 CQ2: is the case cited legitimate, or only an apparent violation of the rule? A cited case that was not
      decided under R gives no ratio to apply'
  - n: 3
    kind: exception
    as: relevant_differences(C)
    note: 'p. 148 CQ3: can the cited case be dealt with under an already recognized category of exception? Then the present
      case gets its treatment only if it falls in that category too; that it does not is a relevant difference between the
      two cases'
  changes:
  - plan: final-closure
    page: 148
    claim: correction
  note: 'Compared on 2026-11-21 with the owner-supplied 1995 book, p. 148. The page prints the argument from precedent (a
    legitimate case has F but not G, so the rule must be modified), which is entry 57 and from_precedent. This record encodes
    instead the case-based reasoning the same page describes ("a species of case-based reasoning that uses argumentation from
    analogy between two cases") and illustrates with Case 80a: a similar case was decided by a rule, so its conclusion holds
    here. The printed questions are sorted for that reading. relevant_differences(R,C) put the rule in a case slot and is
    now relevant_differences(C), the statement of the analogy records (tools/migration_r2.yml). Name: the original repository''s
    README, Updates of 2019-10-08, records that after correspondence with Douglas Walton on 2019-09-19 "Argument From Precedent"
    was changed to "Argument From Exception To A Rule"; commits 0b1dd95 and 16c09f2 (2019-09-22) in this repository''s history
    did it, changing only the id and title of upstream''s precedent (the id''s misspelling is that commit''s, not Walton''s
    wording, and the id is kept, docs/reviews.md). The e-mail is private and will not be available; the README is the official
    record of it (owner, 2026-11-21). Walton''s name agrees with the reading approved here: the record argues from an exception
    granted in a decided case (Case 80a), not to the modification of the rule that entry 57 concludes.'
  review:
    {by: 'ChatGPT final_sources, independent model-assisted source reviewer', date: '2026-11-22', decision: approved, independent_of_author: true, independence_basis: 'Separate reviewer from Claude, the author of the final-closure changes, and from the integrating reviewer who applies citation corrections. Inspected the supplied source passages, current formula/templates/question mapping, reference expectations and exact final fingerprint; authored no reviewed central scheme/ledger changes. Source review is model-assisted technical evidence, not authenticated human or original-author certification.', note: 'Approved as an interpretation of p. 148 (Case 80a), not as the printed scheme, with the arity correction. Earlier: Obtain the cited 1995 p. 148 and any preserved 2019 correspondence underlying the rename; adjudicate whether this is precedent or exception, inventory actual source CQs, and replace the generic reference example with a sourced interpretation. Evidence: docs/reviews/record-dispositions.json: exeption_to_rule Implementer, 2026-11-21: the cited page (1995, p. 148) is the reference the compendium prints for entry 57, argument from precedent (p. 344), but this record applies the ratio of a similar case, while entry 57 concludes from a counterexample that the rule needs an exception or a change; it is not approved against 57. Sources and identifiers: docs/reviews/d20-approvals.md. See docs/reviews/final-closure.md. Current acceptance: Accept declared Case80a case-based interpretation and adapted question mapping, not literal transcription of printed precedent schema or authentication of private correspondence. See docs/reviews/final-source-acceptance.json: exeption_to_rule.'}
