# Reference cases for the changes of PLAN.md Phase 5 (5.1 and 5.2: the
# printed critical questions sorted, and the ones a record did not model added
# as an assumption or an exception). Each change has a positive example (the
# premises of the book's entry hold, nothing is questioned or shown, the
# conclusion is in) and an adverse one (the question raised, or a near miss
# the change rules out), written before the edit (D13). The constants stand
# for the book's variables; the page is the compendium's.
cases:
  # --- batch 1: entries 1 to 17 ---------------------------------------------
  # 4 popular_opinion (p. 311): the assumption generally_accepted(A) repeated
  # the general acceptance premise in other words (CQ1 restates it, p. 374);
  # it goes. CQ2 stays an exception.
  - name: popular_opinion/positive
    source: "4, p. 311"
    assumptions:
      - generally_true(tax_cut)
      - favor(tax_cut)
    arguments:
      - popular_opinion(tax_cut)
    in:
      - reason_in_favor(tax_cut)
  - name: popular_opinion/adverse-no-general-acceptance
    source: "4, p. 311, CQ1"
    assumptions:
      - favor(tax_cut)
    no_arguments: [popular_opinion]
    not_in:
      - reason_in_favor(tax_cut)
  - name: popular_opinion/adverse-reasons-for-doubt
    source: "4, p. 311, CQ2"
    assumptions:
      - generally_true(tax_cut)
      - favor(tax_cut)
      - doubting_general(tax_cut)
    arguments:
      - popular_opinion(tax_cut)
    not_in:
      - reason_in_favor(tax_cut)

  # 6.1 from_example (p. 314): CQ2, whether the example supports the
  # generalization, is an assumption.
  - name: from_example/positive
    source: "6.1, p. 314"
    assumptions:
      - has_properties(tweety,bird,flies)
    arguments:
      - from_example(tweety,bird,flies)
    in:
      - both_properties(tweety,bird,flies)
  - name: from_example/adverse-support-questioned
    source: "6.1, p. 314, CQ2"
    assumptions:
      - has_properties(tweety,bird,flies)
    questioned:
      - supports_generalization(tweety,bird,flies)
    not_in:
      - both_properties(tweety,bird,flies)
  - name: from_example/support-questioned-and-shown
    source: "6.1, p. 314, CQ2; pp. 373-375"
    assumptions:
      - has_properties(tweety,bird,flies)
      - supports_generalization(tweety,bird,flies)
    questioned:
      - supports_generalization(tweety,bird,flies)
    in:
      - both_properties(tweety,bird,flies)

  # 14 verbal_classification (p. 319): CQ2, a classification that rests
  # merely on doubtful word usage, is an exception.
  - name: verbal_classification/positive
    source: "14, p. 319"
    assumptions:
      - instance(rex,dog)
      - subclass(dog,mammal)
    arguments:
      - verbal_classification(rex,dog,mammal)
    in:
      - instance(rex,mammal)
  - name: verbal_classification/adverse-doubtful-usage
    source: "14, p. 319, CQ2"
    assumptions:
      - instance(rex,dog)
      - subclass(dog,mammal)
      - doubtful_classification(dog,mammal)
    arguments:
      - verbal_classification(rex,dog,mammal)
    not_in:
      - instance(rex,mammal)

  # 16 verbal_classification_vagueness (pp. 319-320): premise 2 says that the
  # argument occurs in a context that requires precision; the record said it
  # of the property.
  - name: verbal_classification_vagueness/positive
    source: "16, pp. 319-320"
    assumptions:
      - vague_defined_property(arg1,heap)
      - property_precion_needed(arg1)
      - property_vagueness(heap,arg1)
    arguments:
      - verbal_classification_vagueness(arg1,heap)
    in:
      - vaguness_recejted(arg1)
  - name: verbal_classification_vagueness/adverse-precision-said-of-the-property
    source: "16, pp. 319-320"
    assumptions:
      - vague_defined_property(arg1,heap)
      - property_precion_needed(heap)
      - property_vagueness(heap,arg1)
    no_arguments: [verbal_classification_vagueness]
    not_in:
      - vaguness_recejted(arg1)
  - name: verbal_classification_vagueness/exception
    source: "16, p. 320, CQ3"
    assumptions:
      - vague_defined_property(arg1,heap)
      - property_precion_needed(arg1)
      - property_vagueness(heap,arg1)
      - certainity_no_need(arg1,heap)
    arguments:
      - verbal_classification_vagueness(arg1,heap)
    not_in:
      - vaguness_recejted(arg1)

  # 17 verbal_classification_arbitrariness (p. 320): CQ3, why arbitrariness is
  # a problem in this dialogue, is an exception, as for 16.
  - name: verbal_classification_arbitrariness/positive
    source: "17, p. 320"
    assumptions:
      - arbitrary_defined_property(arg1,poverty)
      - needed_nonarbitrary(arg1,poverty)
      - arbitrary_property(poverty,arg1)
    arguments:
      - verbal_classification_arbitrariness(arg1,poverty)
    in:
      - arbitrary_rejected(arg1)
  - name: verbal_classification_arbitrariness/adverse-arbitrariness-harmless
    source: "17, p. 320, CQ3"
    assumptions:
      - arbitrary_defined_property(arg1,poverty)
      - needed_nonarbitrary(arg1,poverty)
      - arbitrary_property(poverty,arg1)
      - arbitrariness_harmless(arg1,poverty)
    arguments:
      - verbal_classification_arbitrariness(arg1,poverty)
    not_in:
      - arbitrary_rejected(arg1)

  # --- batch 2: entries 18 to 30 --------------------------------------------
  # 23 two_person_practical (pp. 325-326): the exceptions of CQ2 and CQ3 were
  # bound to the persons instead of the goal and the action; CQ5, whether
  # other actions are required as well, is an exception.
  - name: two_person_practical/positive
    source: "23, pp. 325-326"
    assumptions:
      - tells_intend(ann,trip,bob)
      - situation_necessiy(bob,ticket,trip,ann)
    arguments:
      - two_person_practical(ann,bob,trip,ticket)
    in:
      - should_carry_out(ann,ticket)
  - name: two_person_practical/adverse-alternative-means
    source: "23, p. 326, CQ2"
    assumptions:
      - tells_intend(ann,trip,bob)
      - situation_necessiy(bob,ticket,trip,ann)
      - alternative_means(trip,ticket)
    not_in:
      - should_carry_out(ann,ticket)
  - name: two_person_practical/old-binding-does-not-undercut
    source: "23, p. 326, CQ2"
    assumptions:
      - tells_intend(ann,trip,bob)
      - situation_necessiy(bob,ticket,trip,ann)
      - alternative_means(ann,trip)
    in:
      - should_carry_out(ann,ticket)
  - name: two_person_practical/adverse-side-effects
    source: "23, p. 326, CQ3"
    assumptions:
      - tells_intend(ann,trip,bob)
      - situation_necessiy(bob,ticket,trip,ann)
      - side_effect_other_act(ticket,ann)
    not_in:
      - should_carry_out(ann,ticket)
  - name: two_person_practical/adverse-other-actions-required
    source: "23, p. 326, CQ5"
    assumptions:
      - tells_intend(ann,trip,bob)
      - situation_necessiy(bob,ticket,trip,ann)
      - other_actions_required(trip,ticket)
    not_in:
      - should_carry_out(ann,ticket)

  # 24 waste (p. 326): CQ2, a reassessment from now on with past losses set
  # aside, is an exception.
  - name: waste/positive
    source: "24, p. 326"
    assumptions:
      - stop_realize_wasted(ann,thesis)
      - waste_bad_thing(ann,thesis)
    arguments:
      - waste(ann,thesis)
    in:
      - ought_to_continue(ann,thesis)
  - name: waste/adverse-reassessment
    source: "24, p. 326, CQ2"
    assumptions:
      - stop_realize_wasted(ann,thesis)
      - waste_bad_thing(ann,thesis)
      - reassessment_against_continuing(ann,thesis)
    not_in:
      - ought_to_continue(ann,thesis)

  # 26.1 negative_normal_expectations (p. 327): CQ1 of the list printed after
  # 26.2, how far the search for evidence has progressed, is the exception
  # 26 uses, uninvestigated(A).
  - name: negative_normal_expectations/positive
    source: "26.1, p. 327"
    assumptions:
      - normal_true(alarm_silent)
      - case_not_true(alarm_silent)
    arguments:
      - negative_normal_expectations(alarm_silent)
    in:
      - not_normal
  - name: negative_normal_expectations/adverse-not-investigated
    source: "26.1, p. 327, CQ1"
    assumptions:
      - normal_true(alarm_silent)
      - case_not_true(alarm_silent)
      - uninvestigated(alarm_silent)
    not_in:
      - not_normal

  # --- batch 3: entries 31 to 40 --------------------------------------------
  # 31.1, 31.2 (pp. 329-330): CQ3 and CQ4 of the list printed after 31.2, how
  # far the inquiry has progressed and whether to continue it, are the
  # exception inquiry_incomplete(D); for 31.2, CQ1 is the assumption 31.1
  # uses, sufficient_account.
  - name: abductive_backward/positive
    source: "31.1, p. 329"
    assumptions:
      - data_set(d)
      - data_account(a1,d)
      - succesful_account(best,d)
    arguments:
      - abductive_backward(a1,best,d)
    in:
      - plausible_hypothesis(best)
  - name: abductive_backward/adverse-inquiry-incomplete
    source: "31.1, p. 330, CQ3 and CQ4"
    assumptions:
      - data_set(d)
      - data_account(a1,d)
      - succesful_account(best,d)
      - inquiry_incomplete(d)
    not_in:
      - plausible_hypothesis(best)
  - name: abductive_forward/positive
    source: "31.2, pp. 329-330"
    assumptions:
      - data_set(d)
      - diagram_set(g,d,c)
      - succesful_diagram(c1)
    arguments:
      - abductive_forward(d,g,c,c1)
    in:
      - plausible_conclusion(c1)
  - name: abductive_forward/adverse-account-questioned
    source: "31.2, p. 330, CQ1"
    assumptions:
      - data_set(d)
      - diagram_set(g,d,c)
      - succesful_diagram(c1)
    questioned:
      - sufficient_account(c1,d)
    not_in:
      - plausible_conclusion(c1)
  - name: abductive_forward/adverse-inquiry-incomplete
    source: "31.2, p. 330, CQ3 and CQ4"
    assumptions:
      - data_set(d)
      - diagram_set(g,d,c)
      - succesful_diagram(c1)
      - inquiry_incomplete(d)
    not_in:
      - plausible_conclusion(c1)

  # 31.5 retroductive (p. 331): CQ3, whether the action fits the definition
  # of Q, is the assumption 31.3 uses, not_fit_action(A).
  - name: retroductive/positive
    source: "31.5, p. 331"
    assumptions:
      - agent_event(ann)
      - event_quality(greedy)
      - agent_quality(ann,greedy)
    arguments:
      - retroductive(ann,greedy)
    in:
      - event_question(ann)
  - name: retroductive/adverse-fit-questioned
    source: "31.5, p. 331, CQ3"
    assumptions:
      - agent_event(ann)
      - event_quality(greedy)
      - agent_quality(ann,greedy)
    questioned:
      - not_fit_action(ann)
    not_in:
      - event_question(ann)

  # 32.1 and 32.2 (pp. 331-332) share their questions; CQ3 is
  # sufficient_correlation(H,A) in both, where 32.2 had the arguments the
  # other way round, so that the two records named two statements.
  - name: evidence_hypothesis_falsification/positive
    source: "32.2, pp. 331-332"
    assumptions:
      - hypothesis_event(h,e)
      - event_false(e)
    arguments:
      - evidence_hypothesis_falsification(h,e)
    in:
      - ¬h
  - name: evidence_hypothesis_falsification/adverse-correlation-questioned
    source: "32.2, p. 332, CQ3"
    assumptions:
      - hypothesis_event(h,e)
      - event_false(e)
    questioned:
      - sufficient_correlation(h,e)
    not_in:
      - ¬h
  - name: evidence_hypothesis/one-correlation-statement-for-both
    source: "32.1, 32.2, p. 332, CQ3"
    assumptions:
      - hypothesis_event(h,e)
      - event_true(e)
      - hypothesis_event(k,f)
      - event_false(f)
    questioned:
      - sufficient_correlation(h,e)
      - sufficient_correlation(k,f)
    not_in:
      - h
      - ¬k

  # 33.3 negative_consequences_reasoning (p. 332): CQ1 of the list printed
  # after 33.4, how likely the consequence is, is an assumption, as 33.4 has.
  - name: negative_consequences_reasoning/positive
    source: "33.3, p. 332"
    assumptions:
      - agent_bring_about(tax,recession)
      - bad_for_goals(recession)
    arguments:
      - negative_consequences_reasoning(tax,recession)
    in:
      - should_not_bring_about(tax)
  - name: negative_consequences_reasoning/adverse-likelihood-questioned
    source: "33.3, pp. 332-333, CQ1"
    assumptions:
      - agent_bring_about(tax,recession)
      - bad_for_goals(recession)
    questioned:
      - outcome_likely(tax,recession)
    not_in:
      - should_not_bring_about(tax)

  # 38 help (p. 334): CQ2 and CQ3 restate premises 3 and 4; the assumption
  # possible_carry_out(B,X) and the exception greater_side_effects(X), which
  # said them again, go. Questioning premise 3 is arguing its negation.
  - name: help/positive
    source: "38, p. 334"
    assumptions:
      - help_needed(ann,bob)
      - situation_help(ann,lift,bob)
      - can_carry_out(bob,lift)
      - not_too_costly(bob,lift)
    arguments:
      - help(ann,bob,lift)
    in:
      - carry_out(bob,lift)
  - name: help/adverse-help-questioned
    source: "38, p. 334, CQ1"
    assumptions:
      - help_needed(ann,bob)
      - situation_help(ann,lift,bob)
      - can_carry_out(bob,lift)
      - not_too_costly(bob,lift)
    questioned:
      - action_will_help(lift,ann)
    not_in:
      - carry_out(bob,lift)
  - name: help/adverse-premise-missing
    source: "38, p. 334, CQ3"
    assumptions:
      - help_needed(ann,bob)
      - situation_help(ann,lift,bob)
      - can_carry_out(bob,lift)
    no_arguments: [help]
    not_in:
      - carry_out(bob,lift)

  # 39 distress (pp. 334-335): the relief is of x's distress, relieve(B,X,A);
  # the record did not say whose. CQ1 restates premise 1; the assumption
  # really_distress(A), which said it again, goes.
  - name: distress/positive
    source: "39, pp. 334-335"
    assumptions:
      - distress(ann)
      - relieve(bob,lift,ann)
    arguments:
      - distress(bob,lift,ann)
    in:
      - bring_relive(bob,lift)
  - name: distress/adverse-someone-elses-distress
    source: "39, p. 334"
    assumptions:
      - distress(ann)
      - relieve(bob,lift,cat)
    no_arguments: [distress]
    not_in:
      - bring_relive(bob,lift)
  - name: distress/adverse-side-effects
    source: "39, p. 335, CQ4"
    assumptions:
      - distress(ann)
      - relieve(bob,lift,ann)
      - great_side_effects(bob,lift)
    not_in:
      - bring_relive(bob,lift)

  # 40 commitment1, commitment2 (p. 335): CQ1's first half restates the
  # commitment premise, and the assumption commitment_support_evidence(A,X),
  # which said it again, goes; CQ2, an exception to the linkage rule, is the
  # exception commitment_linkage_exception(A,X,Y).
  - name: commitment1/positive
    source: "40, p. 335, version 1"
    assumptions:
      - committed(ann,p)
      - also_committed(p,q)
    arguments:
      - commitment1(ann,p,q)
    in:
      - committed_to(ann,q)
  - name: commitment1/adverse-linkage-exception
    source: "40, p. 335, CQ2"
    assumptions:
      - committed(ann,p)
      - also_committed(p,q)
      - commitment_linkage_exception(ann,p,q)
    not_in:
      - committed_to(ann,q)
  - name: commitment2/positive
    source: "40, p. 335, version 2"
    assumptions:
      - also_committed_questioned(ann,p,q)
      - dialog_committed(ann,p)
    arguments:
      - commitment2(ann,p,q)
    in:
      - commitment_arises(ann,q)
  - name: commitment2/adverse-contrary-evidence
    source: "40, p. 335, CQ1"
    assumptions:
      - also_committed_questioned(ann,p,q)
      - dialog_committed(ann,p)
      - commitment_contrary_evidence(ann,p)
    not_in:
      - commitment_arises(ann,q)

  # --- batch 4: entries 41 to 60 --------------------------------------------
  # 42 ad_hominem (p. 336): CQ1 restates the character attack premise, as the
  # book itself says of this question (p. 374); the assumption
  # attack_well_supported goes. Questioning it no longer matters.
  - name: ad_hominem/questioning-the-removed-assumption-is-idle
    source: "42, p. 336, CQ1; p. 374"
    assumptions:
      - bad_character(bob)
      - advocates_conclusion(bob,arg1,tax_cut)
    questioned: [attack_well_supported]
    in:
      - bad_not_accepted(bob,arg1)

  # 43 pragmatic_inconsistency (pp. 336-337): CQ2 restates premise 2, and the
  # assumption descriptions_opposite(A,S) goes; CQ3, why the inconsistency is
  # a relevant reason, is the assumption inconsistency_relevant(A,S).
  - name: pragmatic_inconsistency/positive
    source: "43, pp. 336-337"
    assumptions:
      - advocates_conclusion(bob,arg1,tax_cut)
      - opposite_action(bob,arg1,¬tax_cut)
    arguments:
      - pragmatic_inconsistency(bob,arg1,tax_cut)
    in:
      - arguement_not_accepted(bob,arg1)
  - name: pragmatic_inconsistency/adverse-relevance-questioned
    source: "43, p. 337, CQ3"
    assumptions:
      - advocates_conclusion(bob,arg1,tax_cut)
      - opposite_action(bob,arg1,¬tax_cut)
    questioned:
      - inconsistency_relevant(bob,arg1)
    not_in:
      - arguement_not_accepted(bob,arg1)

  # 44 inconsistent_commitment (p. 337): the exception evidence_not_commited
  # said what premise 2 says, so the evidence for the conclusion undercut the
  # argument; it goes. CQ3, whether the evidence proves a conflict, is the
  # assumption commitments_conflict(A,S).
  - name: inconsistent_commitment/positive
    source: "44, p. 337"
    assumptions:
      - initial_commitment(bob,tax_cut)
      - opposed_commitment(bob,tax_cut)
    arguments:
      - inconsistent_commitment(bob,tax_cut)
    in:
      - inconsistent_commitment(bob)
  - name: inconsistent_commitment/the-evidence-of-premise-2-does-not-undercut
    source: "44, p. 337"
    assumptions:
      - initial_commitment(bob,tax_cut)
      - opposed_commitment(bob,tax_cut)
      - evidence_not_commited(bob,tax_cut)
    in:
      - inconsistent_commitment(bob)
  - name: inconsistent_commitment/adverse-conflict-questioned
    source: "44, p. 337, CQ3"
    assumptions:
      - initial_commitment(bob,tax_cut)
      - opposed_commitment(bob,tax_cut)
    questioned:
      - commitments_conflict(bob,tax_cut)
    not_in:
      - inconsistent_commitment(bob)

  # 45 circumstantial_ad_hominem (pp. 337-338): the inconsistent commitment
  # premise is to the opposite of the conclusion C, not of the argument S;
  # CQ2, an inconsistency resolved or explained, is the exception
  # inconsistency_explained(A,S).
  - name: circumstantial_ad_hominem/positive
    source: "45, p. 337"
    assumptions:
      - advocates_conclusion(bob,arg1,tax_cut)
      - commited_opposite(bob,tax_cut)
      - credibility_questioned(bob)
    arguments:
      - circumstantial_ad_hominem(bob,arg1,tax_cut)
    in:
      - plausibility_decreased(bob,arg1)
  - name: circumstantial_ad_hominem/adverse-opposite-of-another-proposition
    source: "45, p. 337"
    assumptions:
      - advocates_conclusion(bob,arg1,tax_cut)
      - commited_opposite(bob,arg1)
      - credibility_questioned(bob)
    no_arguments: [circumstantial_ad_hominem]
    not_in:
      - plausibility_decreased(bob,arg1)
  - name: circumstantial_ad_hominem/adverse-inconsistency-explained
    source: "45, p. 338, CQ2"
    assumptions:
      - advocates_conclusion(bob,arg1,tax_cut)
      - commited_opposite(bob,tax_cut)
      - credibility_questioned(bob)
      - inconsistency_explained(bob,arg1)
    not_in:
      - plausibility_decreased(bob,arg1)

  # 46 bias (p. 338): the major premise is stated for the arguer at hand, as
  # exeptional's was in 3.7 (5.3), and X goes; CQ1, the type of dialogue, is
  # the assumption bias_relevant(A,C).
  - name: bias/positive
    source: "46, p. 338"
    assumptions:
      - not_taken_both(bob,tax_cut)
      - biased(bob)
    arguments:
      - bias(bob,tax_cut)
    in:
      - arguer_not_taken_both(bob,tax_cut)
  - name: bias/adverse-another-persons-premise
    source: "46, p. 338"
    assumptions:
      - not_taken_both(ann,tax_cut)
      - biased(bob)
    no_arguments: [bias]
    not_in:
      - arguer_not_taken_both(bob,tax_cut)
  - name: bias/adverse-dialogue-questioned
    source: "46, p. 338, CQ1"
    assumptions:
      - not_taken_both(bob,tax_cut)
      - biased(bob)
    questioned:
      - bias_relevant(bob,tax_cut)
    not_in:
      - arguer_not_taken_both(bob,tax_cut)

  # 53 full_slippery_slope (p. 341): CQ3 restates the group opinion premise;
  # the assumption led_to_step goes. Questioning it no longer matters.
  - name: full_slippery_slope/positive
    source: "53, p. 341"
    assumptions:
      - initial_presumption(c0)
      - leads_to_next(c0,c1,cn)
      - accept_all_steps
    arguments:
      - full_slippery_slope(c0,c1,cn)
    in:
      - not_acceptable_step(c0)
  - name: full_slippery_slope/questioning-the-removed-assumption-is-idle
    source: "53, p. 341, CQ3"
    assumptions:
      - initial_presumption(c0)
      - leads_to_next(c0,c1,cn)
      - accept_all_steps
    questioned: [led_to_step]
    in:
      - not_acceptable_step(c0)

  # 56 exeptional (p. 344): the three conditional questions ask for the
  # exception to be backed, by its recognized type, by evidence that the rule
  # does not apply, or by comparable cases (5.3): the assumption
  # exception_backed(A).
  - name: exeptional/positive
    source: "56, p. 344"
    assumptions:
      - rule_can_waived(ann)
      - case_exception(ann)
    arguments:
      - exeptional(ann)
    in:
      - rule_waived(ann)
  - name: exeptional/adverse-exception-questioned
    source: "56, p. 344, CQ1"
    assumptions:
      - rule_can_waived(ann)
      - case_exception(ann)
    questioned:
      - exception_backed(ann)
    not_in:
      - rule_waived(ann)
  - name: exeptional/questioned-and-backed
    source: "56, p. 344, CQ2 and CQ3"
    assumptions:
      - rule_can_waived(ann)
      - case_exception(ann)
