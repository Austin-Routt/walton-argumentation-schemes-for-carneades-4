# Hand-specified positive and adverse source cases. See docs/source-branch-contracts.md.
cases:
- name: moral_justification_actual_goal/book
  source: '4.5, p.312: actual goal and same named respondent'
  assumptions:
  - good_group(good_citizens,recycling_policy)
  - goal_good_group_for(ann,good_citizens)
  arguments:
  - moral_justification_actual_goal(ann,good_citizens,recycling_policy)
  in:
  - should_do(ann,accept(recycling_policy))
  not_in:
  - should_do(bob,accept(recycling_policy))
  no_arguments:
  - moral_justification_ought_goal
  variants: true
- name: moral_justification_ought_goal/book
  source: '4.5, p.312: the parenthetical normative goal does not assert an actual goal'
  assumptions:
  - good_group(good_citizens,recycling_policy)
  - ought_goal_good_group(ann,good_citizens)
  arguments:
  - moral_justification_ought_goal(ann,good_citizens,recycling_policy)
  in:
  - should_do(ann,accept(recycling_policy))
  not_in:
  - goal_good_group_for(ann,good_citizens)
  no_arguments:
  - moral_justification_actual_goal
  variants: true
- name: moral_justification_actual_goal/closure-other-group-goal
  source: '4.5: goal of membership in another group cannot be substituted'
  assumptions:
  - good_group(good_citizens,recycling_policy)
  - goal_good_group_for(ann,other_group)
  not_in:
  - should_do(ann,accept(recycling_policy))
  no_arguments:
  - moral_justification_actual_goal
- name: moral_justification_ought_goal/closure-other-group-goal
  source: '4.5: the ought-goal also names the same group'
  assumptions:
  - good_group(good_citizens,recycling_policy)
  - ought_goal_good_group(ann,other_group)
  not_in:
  - should_do(ann,accept(recycling_policy))
  no_arguments:
  - moral_justification_ought_goal
- name: moral_excuse_action/book
  source: '4.6, p.312: named speaker, same action, explicit group norm'
  assumptions:
  - group_acts(cyclists,wear_helmet)
  - action_norm(wear_helmet,cyclists)
  - person_group_member(ann,cyclists)
  arguments:
  - moral_excuse_action(ann,cyclists,wear_helmet)
  in:
  - morally_justified(ann,wear_helmet)
  not_in:
  - morally_justified(bob,wear_helmet)
  - morally_justified(ann,accept(wear_helmet))
  no_arguments:
  - moral_excuse_policy
  variants: true
- name: moral_excuse_policy/book
  source: '4.6, p.312: named speaker and policy-acceptance branch in the full library'
  assumptions:
  - group_accepted(cyclists,helmet_policy)
  - policy_norm(helmet_policy,cyclists)
  - person_group_member(ann,cyclists)
  arguments:
  - moral_excuse_policy(ann,cyclists,helmet_policy)
  in:
  - morally_justified(ann,accept(helmet_policy))
  not_in:
  - morally_justified(bob,accept(helmet_policy))
  no_arguments:
  - moral_excuse_action
  variants: true
- name: moral_excuse_policy/closure-accepting-does-not-prove-truth
  source: '4.6: this selected live record justifies acceptance and does not assert policy truth; the full library has a separate
    pop_scheme'
  assumptions:
  - group_accepted(cyclists,helmet_policy)
  - policy_norm(helmet_policy,cyclists)
  - person_group_member(ann,cyclists)
  arguments:
  - moral_excuse_policy(ann,cyclists,helmet_policy)
  in:
  - morally_justified(ann,accept(helmet_policy))
  not_in:
  - helmet_policy
  schemes:
  - moral_excuse_policy
- name: moral_excuse_action/closure-other-speaker-group
  source: '4.6: the speaker must belong to the group whose practice is cited'
  assumptions:
  - group_acts(cyclists,wear_helmet)
  - action_norm(wear_helmet,cyclists)
  - person_group_member(ann,swimmers)
  not_in:
  - morally_justified(ann,wear_helmet)
  no_arguments:
  - moral_excuse_action
- name: moral_excuse_policy/closure-other-policy-norm
  source: '4.6: acceptability of another policy does not warrant this policy'
  assumptions:
  - group_accepted(cyclists,helmet_policy)
  - policy_norm(speed_policy,cyclists)
  - person_group_member(ann,cyclists)
  not_in:
  - morally_justified(ann,accept(helmet_policy))
  no_arguments:
  - moral_excuse_policy
- name: moral_excuse_action/closure-policy-evidence-is-not-action-evidence
  source: '4.6: the two printed alternatives are not mixed'
  assumptions:
  - group_accepted(cyclists,helmet_policy)
  - action_norm(wear_helmet,cyclists)
  - person_group_member(ann,cyclists)
  not_in:
  - morally_justified(ann,wear_helmet)
  - morally_justified(ann,accept(helmet_policy))
  no_arguments:
  - moral_excuse_action
  - moral_excuse_policy
- name: moral_excuse_action/closure-generic-member-is-not-person
  source: '4.6: generic membership includes products and ideas in entry21.2 and does not supply a speaking person'
  assumptions:
  - group_acts(cyclists,wear_helmet)
  - action_norm(wear_helmet,cyclists)
  - group_member(helmet_product,cyclists)
  - group_accepted(cyclists,helmet_policy)
  - policy_norm(helmet_policy,cyclists)
  not_in:
  - morally_justified(helmet_product,wear_helmet)
  - morally_justified(helmet_product,accept(helmet_policy))
  no_arguments:
  - moral_excuse_action
  - moral_excuse_policy
