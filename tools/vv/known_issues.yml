  # schemes that feed themselves or each other
  - {issue: X-LOOP, scheme: exeptional, checks: [static/not-self-feeding, iso/terminates, iso/premises-needed, full/terminates, full/premises-needed]}
  - {issue: X-LOOP, file: walton.yml, scheme: composition_generic, checks: [full/terminates, full/premises-needed]}
  - {issue: X-LOOP, file: walton.yml, scheme: division_generic,    checks: [full/terminates, full/premises-needed]}

  # variables no premise binds
  - {issue: X-RANGE, scheme: practical_necessary_condition,  checks: [engine-validator, static/range-restricted, iso/ground, iso/premises, iso/exceptions-undercut, full/ground, full/exceptions-undercut]}
  - {issue: X-RANGE, scheme: practical_sufficient_condition, checks: [engine-validator, static/range-restricted, iso/ground, iso/premises, iso/exceptions-undercut, full/ground, full/exceptions-undercut]}
  - {issue: X-RANGE, scheme: ad_hominem,      checks: [engine-validator, static/range-restricted, iso/ground, iso/conclusions-in, iso/exceptions-undercut, full/ground, full/conclusions-in, full/exceptions-undercut]}
  - {issue: X-RANGE, scheme: regulative_rule, checks: [engine-validator, static/range-restricted, iso/ground, iso/conclusions-in, full/ground, full/conclusions-in]}
  - {issue: X-RANGE, scheme: sorites_slippery_slope, checks: [engine-validator, static/range-restricted]}
  # ... and for this one the unbound A is captured by the scheme's own A1: it concludes may_have(<A1>,P)
  - {issue: E-CAPTURE, scheme: sorites_slippery_slope, checks: [static/no-variable-capture, iso/conclusions-in, full/conclusions-in]}

  # the book's compendium
