  - {issue: X-NEG, scheme: from_antimodel,           checks: [static/no-negated-premise, iso/fires, iso/conclusions-in, iso/premises-needed, full/fires, full/conclusions-in, full/premises-needed, cli/scenario]}
  - {issue: X-NEG, scheme: opposition-descriptive_2, checks: [static/no-negated-premise, iso/fires, iso/conclusions-in, iso/premises-needed, full/fires, full/conclusions-in, full/premises-needed, cli/scenario]}
  - {issue: X-NEG, scheme: opposition-descriptive_3, checks: [static/no-negated-premise, iso/fires, iso/conclusions-in, iso/premises-needed, full/fires, full/conclusions-in, full/premises-needed, cli/scenario]}
  - {issue: X-NEG, scheme: ignorance,                checks: [static/no-negated-premise, iso/fires, iso/conclusions-in, iso/exceptions-undercut, iso/premises-needed, full/fires, full/conclusions-in, full/exceptions-undercut, full/premises-needed, cli/scenario]}

  # is/2 as a conclusion
