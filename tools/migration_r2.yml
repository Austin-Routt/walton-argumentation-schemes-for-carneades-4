# The one migration of release R2 (PLAN.md D4, 5.6): every change to a
# record that alters what a graph file has to state, from old to new. A graph
# written for 0.1.0 (release R1) is brought to R2 by applying these rows in
# order. 5.6 adds the renamings of misspelt identifiers, the statements shared
# by meaning and role, and a script that applies the table
# (tools/migrate_r2.py). A rename holds for every row of the table, before or
# after it, and a chain of renames (A to B, then B to C) is followed to its end.
#
#   record   the scheme
#   kind     arguments (the same predicate, other arguments), arity (the
#            predicate gains or loses an argument), replaced (another
#            predicate), removed (the record no longer uses the statement),
#            premise (a premise added: a graph has to state it), added (a new
#            assumption or exception; nothing to migrate, listed so that the
#            table is complete)
#   old/new  the statement as the record writes it
#            rename-scheme, rename-predicate (name/arity), rename-file: the
#            identifiers of 5.6, applied by tools/migrate_r2.py; wording: a
#            change of the language templates only
#   plan     the plan item; page: the compendium's page
#   trigger  optional old premise that signals a new premise needs review;
#            old stays empty because that old premise remains in the scheme
