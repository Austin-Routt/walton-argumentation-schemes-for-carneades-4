# Generated from walton.yml by tools/build_category_files.py. Do not edit:
# change walton.yml (or the grouping in categories.yml) and run the tool again.

meta:
  title: "Reasoning - Inductive Reasoning"
  version: "0.2.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  physical_part_of/2: "%s is a physical part of %s."
  degree_comparable/3: "%s and %s are comparable on the same contextually specified degree scale for property %s."
  smaller_in_relevant_measure/2: "%s is smaller than %s in the measure relevant to this part-whole comparison."
  less_property_than/3: "%[1]s has property %[2]s to a lesser degree than %[3]s, on the stated comparison scale."
  whole_partition/2: "%s has exactly the finite, nonempty set of parts identified by %s in this application."
  partition_member/2: "%s is a member of the part set %s."
  some_part_sufficient_for_whole/3: "For whole %s and its stated part set %s, having at least one part with property %s is sufficient for the whole to have that property."
  whole_requires_property_part/3: "Whole %[1]s can have property %[3]s only if at least one member of its stated part set %[2]s has that property."
  no_partition_part_property/3: "No member of part set %[2]s of whole %[1]s has property %[3]s; this is supported universal negative evidence, not mere absence of a positive fact."
  all_parts_property/2: "All the parts of %s have the property %s."
  compositionally_hereditary/2: "Property %[2]s is compositionally hereditary with regard to %[1]s: if every part has it, the whole has it."
  has_property/2: "%s has property %s."
  member_group_quality/3: "If the member %s has quality %s, then %s will have it as well."
  member_quality/3: "Member %s of the group %s has the quality %s."
  part_whole/5: "%[1]s is %[2]s only if %[3]s, %[4]s or %[5]s is."
  species_of/2: "%s is a species of %s."
  whole_of/4: "%s is the whole of %s, %s and %s."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: group_1
    meta:
      title: Argument From A Group and Its Members - Variant 1
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 21.1, p. 322. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 321-326."
    variables: [G,Q,M]
    conclusions: 
      - has_property(G,Q)
    premises: 
      - member_quality(M,G,Q)
      - member_group_quality(M,Q,G)

  - id: composition_generic
    meta:
      title: Argument From Composition - Generic
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.1, p. 316. Douglas Walton, Informal Logic. New York: Cambridge University Press, 1989, p.130."
    variables: [A,P]
    conclusions:
      - has_property(A,P)
    premises:
      - all_parts_property(A,P)
    assumptions: 
     - compositionally_hereditary(A,P)

  - id: part_in_whole
    meta:
      title: Argument From Composition - Inclusion of The Part in the Whole 
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.2, p. 316. Ch. Perelman and L.Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.231-233,234-241."
    variables: [Y,X,A]
    conclusions:
      - has_property(Y,A)
    premises:
      - species_of(Y,X)
      - has_property(X,A)

  - id: part_in_whole_physical
    meta:
      title: Inclusion of a Physical Part in the Whole
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.2, p. 316. Ch. Perelman and L.Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.231-233,234-241.'
    variables:
    - Y
    - X
    - A
    conclusions:
    - has_property(Y,A)
    premises:
    - physical_part_of(Y,X)
    - has_property(X,A)

  - id: part_in_whole_species_degree
    meta:
      title: Species Inclusion with a Qualitative Lesser-Degree Conclusion
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.2, p. 316. Ch. Perelman and L.Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.231-233,234-241.'
    variables:
    - Y
    - X
    - A
    conclusions:
    - has_property(Y,A)
    - less_property_than(Y,A,X)
    premises:
    - species_of(Y,X)
    - has_property(X,A)
    - degree_comparable(Y,X,A)

  - id: part_in_whole_physical_degree
    meta:
      title: Physical-Part Inclusion with a Qualitative Lesser-Degree Conclusion
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.2, p. 316. Ch. Perelman and L.Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.231-233,234-241.'
    variables:
    - Y
    - X
    - A
    conclusions:
    - has_property(Y,A)
    - less_property_than(Y,A,X)
    premises:
    - physical_part_of(Y,X)
    - has_property(X,A)
    - degree_comparable(Y,X,A)

  - id: part_in_whole_smaller_degree
    meta:
      title: Smaller-Part Inclusion with a Qualitative Lesser-Degree Conclusion
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 9.2, p. 316. Ch. Perelman and L.Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp.231-233,234-241.'
    variables:
    - Y
    - X
    - A
    conclusions:
    - has_property(Y,A)
    - less_property_than(Y,A,X)
    premises:
    - physical_part_of(Y,X)
    - has_property(X,A)
    - smaller_in_relevant_measure(Y,X)
    - degree_comparable(Y,X,A)

  - id: whole_into_parts
    meta:
      title: Argument From Division - Division of the Whole into its Parts
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 10.2, p. 317. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 231-233,234-241."
    variables: [X,X1,X2,X3,A]
    conclusions:
      - has_property(X,A)
    premises:
      - whole_of(X,X1,X2,X3)
      - part_whole(X,A,X1,X2,X3)
      - has_property(X1,A)

  - id: whole_into_parts_selected
    meta:
      title: Division into Arbitrarily Many Parts - Selected Positive Part with Explicit Sufficiency
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 10.2, p. 317. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 231-233,234-241.'
    variables:
    - X
    - S
    - Y
    - A
    conclusions:
    - has_property(X,A)
    premises:
    - whole_partition(X,S)
    - partition_member(Y,S)
    - some_part_sufficient_for_whole(X,S,A)
    - has_property(Y,A)

  - id: whole_into_parts_negative
    meta:
      title: Division into Arbitrarily Many Parts - Universal Negative Only-If Branch
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 10.2, p. 317. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric:
        A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 231-233,234-241.'
    variables:
    - X
    - S
    - A
    conclusions:
    - ¬has_property(X,A)
    premises:
    - whole_partition(X,S)
    - whole_requires_property_part(X,S,A)
    - no_partition_part_property(X,S,A)
