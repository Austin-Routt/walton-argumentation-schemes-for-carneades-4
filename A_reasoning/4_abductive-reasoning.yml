# Generated from walton.yml by tools/build_category_files.py. Do not edit:
# change walton.yml (or the grouping in categories.yml) and run the tool again.

meta:
  title: "Reasoning - Abductive Reasoning"
  version: "0.2.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  action_character/3: "Agent %s performed action %s, which can be classified as fitting character quality %s."
  agent_event/2: "Agent %s appears to have brought about observed event %s."
  character_quality/2: "%s has character quality %s."
  character_action/2: "If %s carries out some action in the future, this action is likely to fit character quality %s."
  data_account/2: "Each account in the set %s is successful in explaining %s."
  data_set/1: "%s is a set of data or supposed facts in a case."
  diagram_set/3: "There is a set of argument diagrams %s and in each argument diagram %s represents premises of an argument that, supplemented by plausible conditionals and other statements that function as missing parts of enthymemes, leads to a respective conclusion %s."
  event_false/1: "%s has been observed to be false, in a given instance."
  event_quality/2: "The bringing about of event %s fits character quality %s."
  event_question/2: "%s brought about event %s."
  event_true/1: "%s has been observed to be true, in a given instance."
  explanation/2: "Theory %s explains %s."
  has_property/2: "%s has property %s."
  hypothesis_event/2: "If hypothesis %s is true, then proposition reporting event %s will be observed to be true."
  in/2: "%s contains %s as a member."
  indicated_true/2: "%s is generally indicated as true when its sign %s is true."
  inquiry_incomplete/1: "The inquiry into %s has not progressed far enough to draw a conclusion now."
  more_coherent_explanation/2: "There exists a more coherent explanation than theory %s of observation %s."
  more_reliable/1: "There are other events that would more reliably account for the sign %s."
  not_character_action/2: "Relevant actions of agent %s provide sufficient counterevidence against predicting future actions from character quality %s."
  action_fits_quality/3: "The description of agent %s's action or event %s actually fits the definition of quality %s."
  observed/1:  "%s has been observed."
  plausible_conclusion/1: "%s is the most plausible conclusion in the case."
  plausible_hypothesis/1: "%s is the most plausible hypothesis in the case."
  quality_defined/1: "The character quality %s is well defined."
  reference_class/3: "Few agents other than %s might have brought about event %s and have character quality %s."
  strong_correlation/2: "Correlation of %s and %s is strong."
  successful_account/2: "%s is the account that explains %s most successfully."
  successful_diagram/2: "Among the diagrams in %s, the strongest argument is represented by %s."
  diagram_conclusion/2: "The argument represented by diagram %s has conclusion %s."
  sufficient_account/2: "%s itself, as an explanation of %s apart from other alternative explanations available so far, is sufficient."
  sufficient_correlation/2: "Correlation between %s and %s is sufficient."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: sign
    meta:
      title: Argument From Sign
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 30, p. 329. Douglas Walton, Fundamentals of Critical Argumentation. New York: Cambridge University Press, 2006, pp. 113-114."
    variables: [A,B]
    conclusions:
      - B
    premises:
      - A
      - indicated_true(B,A)
    exceptions:
      - more_reliable(A)
    assumptions: 
     - strong_correlation(A,B)

  - id: abductive_backward 
    meta:
      title: Abductive Argumentation Scheme - Backward Argumentation Scheme
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 31.1, p. 329."
    variables: [A,A1,D]
    conclusions:
      - plausible_hypothesis(A1)
    premises:
      - data_set(D)
      - data_account(A,D)
      - successful_account(A1,D)
    assumptions: 
     - sufficient_account(A1,D)
    exceptions:
     - inquiry_incomplete(D)

  - id: abductive_forward
    meta:
      title: Abductive Argumentation Scheme - Forward Argumentation Scheme
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 31.2, p. 329."
    variables: [D,G,C,C1,G1]
    conclusions:
      - plausible_conclusion(C1) 
    premises:
      - data_set(D)
      - diagram_set(G,D,C)
      - successful_diagram(G,G1)
      - diagram_conclusion(G1,C1)
    assumptions:
      - sufficient_account(C1,D)
    exceptions:
      - inquiry_incomplete(D)

  - id: abductive_action_to_character
    meta:
      title: Abductive Argumentation Scheme - From Action to Character
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 31.3, p. 330."
    variables: [A,X,Q]
    conclusions:
      - character_quality(A,Q)
      - has_property(A,Q)
    premises:
      - action_character(A,X,Q)
    assumptions: 
     - quality_defined(Q)
     - action_fits_quality(A,X,Q)

  - id: abductive_character_to_action
    meta:
      title: Abductive Argumentation Scheme - From Character to Action (Predictive) 
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 31.4, p. 330."
    variables: [A,Q]
    conclusions:
      - character_action(A,Q)
    premises:
      - character_quality(A,Q)
    exceptions:
      - not_character_action(A,Q)
    assumptions: 
     - quality_defined(Q)

  - id: retroductive
    meta:
      title: Retroductive Scheme for Identifying an Agent from Past Action
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 31.5, p. 331."
    variables: [A,Q,E]
    conclusions:
      - event_question(A,E)
    premises:
      - agent_event(A,E)
      - event_quality(E,Q)
      - has_property(A,Q)
    assumptions: 
     - quality_defined(Q)
     - action_fits_quality(A,E,Q)
     - reference_class(A,E,Q)

  - id: evidence_hypothesis_verification
    meta:
      title: Argument From Evidence to Hypothesis - Argument From Verification 
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 32.1, p. 331. Douglas Walton, Argumentation Schemes for Presumptive Reasoning. Mahwah, N.J.: Erlbaum, 1996, pp. 67-70."
    variables: [H,A]
    conclusions:
      - H
    premises:
      - hypothesis_event(H,A)
      - event_true(A)
    assumptions: 
     - sufficient_correlation(H,A)

  - id: evidence_hypothesis_falsification
    meta:
      title: Argument From Evidence to Hypothesis - Argument From Falsification
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 32.2, p. 331. Douglas Walton, Argumentation Schemes for Presumptive Reasoning. Mahwah, N.J.: Erlbaum, 1996, pp. 67-70."
    variables: [H,A]
    conclusions:
      - ¬H
    premises:
      - hypothesis_event(H,A)
      - event_false(A)
    assumptions: 
     - sufficient_correlation(H,A)

  - id: abduction
    meta:
      title: Abduction
      source: "Carneades 4, examples/AGs/YAML/walton.yml (upstream, commit d19d543), where the record cites no source."
    variables: [S,T,H]
    conclusions: [H]
    premises:
      - observed(S)
      - explanation(T,S)
      - in(T,H)
    exceptions:
      - more_coherent_explanation(T,S)
