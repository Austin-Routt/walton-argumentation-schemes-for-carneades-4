  prevent/1: "You ought to prevent %s if possible."
  promote_more_effectively/2: "There exists an action that would promote the value %s more effectively than %s."
  prudential/1: "You ought to reconsider and, other things being equal, you ought prudentially to do %s."
  realize_more_effectively/2: "There exists an action that would realize the goal %s more effectively than %s."
  reassessment_against_continuing/2: "Past losses that cannot be recouped aside, a reassessment of the costs and benefits from now on speaks against %s continuing to try to realize %s."
  relieve/3: "If %s brings about %s, it will relieve or help to relieve the distress of %s."
  sacrifice_made/2: "For the thing %s, sacrifice %s is made."
  sacrifice_value/2: "%s has a great value %s."
  should_be_performed/1: "Action %s should be performed."
  should_do/2: "%s should do %s."
  side_effect_action/2: "There are negative side effects of %s's bringing about %s that ought to be considered."
  side_effect_other_act/2: "Carrying out %s has known side effects that might conflict with %s's other goals."
  side_effects/2: "Performing %s in %s would have side-effects which demote some value."
  situation_help/3: "%s is in a situation where some action %s by %s would help."
  situation_necessity/4: "As %s sees the situation, %s is a necessary or sufficient condition for carrying out %s; the adviser reports this to %s."
  stop_realize_wasted/2: "If %s stops trying to realize %s now, all previous efforts will be wasted."
  strongly_occur/2: "If you do not do %s, the consequences %s are strongly likely to occur."
  sufficient_action/4: "%s has selected member %s of %s as an acceptable, or as the most acceptable, sufficient condition for %s."
  sunk_costs/2:  "The costs incurred performing %s thus far are %s."
  tells_intend/3: "%s intends to realize %s, and tells %s this."
  too_high_to_waste/1: "The sunk costs of %s are too high to waste."
  undesirable/1: "%s is bad or undesirable, from your point of view."
  waste_bad_thing/2: "If all of %s's previous attempts to realize %s are wasted, that would be a bad thing."
  worse_consequences/2: "Bringing about %s has consequences whose negative value outweighs the positive value of %s."
  worthy_goal/1: "%s is a worthy goal."
  would_be_realized/2: "%s would be realized in %s."
  would_bring_about/3: "Performing %s in %s would bring about %s."
  would_promote_value/2:  "Achieving the goal %s would promote the value %s."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: practical_reasoning1
    meta:
      title: Argument from Value-Based Practical Reasoning
      source: "Atkinson, K., and Bench-Capon, T. J. M. Practical reasoning as presumptive argumentation using action based alternating transition systems. Artificial Intelligence 171, 10-15 (2007), 855–874."
    variables: [A,S1,S2,G,V]
    conclusions:
      - should_be_performed(A)
    premises:
      - current_circumstances(S1)
      - would_bring_about(A,S1,S2)
      - would_be_realized(G,S2)
      - would_promote_value(G,V)
    assumptions:
      - legitimate_value(V)
      - worthy_goal(G)
      - possible(A)
    exceptions:
      - bring_about_more_effectively(S2,A)
      - realize_more_effectively(G,A)
      - promote_more_effectively(V,A)
      - side_effects(A,S1)

  - id: practical_reasoning2
    meta:
      title: Argument from Instrumental Practical Reasoning
      source: "Walton, Douglas (2015). Goal-Based Reasoning for Argumentation. Cambridge University Press."
    variables: [A,S1,S2,G]
    conclusions:
      - should_be_performed(A)
    premises:
      - current_circumstances(S1)
      - would_bring_about(A,S1,S2)
      - would_be_realized(G,S2)
    assumptions:
      - possible(A)
      - possible(G)
    exceptions:
      - bring_about_more_effectively(S2,A)
      - realize_more_effectively(G,A)
      - intervening_actions(A,G)
      - side_effects(A,S1)
      - incompatible_goal(G)

  - id: negative_consequences
    meta:
      title: Argument from Negative Consequences
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 33.2, p. 332. Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156."
    variables: [A,G]
    conclusions:
      - ¬should_be_performed(A)
    premises:
      - brings_about(A,G)
      - bad(G)
    assumptions:
      - consequence_likelihood_adequate(A,G)

  - id: positive_consequences
    meta:
      title: Argument from Positive Consequences
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 33.1, p. 332. Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, pp. 155-156."
    variables: [A,G]
    conclusions:
      - should_be_performed(A)
    premises:
      - brings_about(A,G)
      - good(G)
    assumptions:
      - consequence_likelihood_adequate(A,G)

  - id: alternative_cognitive
    meta:
      title: Argument From Alternatives - Cognitive Schemes
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 13.1, p. 318. Manfred Kienpointner, Alltagslogik, Struktur und Funktion von Argumentationsmustern. Stuttgart-Bad Cannstatt: Frommann-Holzboog, 1992, p.306."
    variables: [A,B]
    conclusions:
      - B
    premises:
      - can_be_case(A,B)
      - ¬A

  - id: alternative_normative
    meta:
      title: Argument From Alternatives - Normative Schemes
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 13.2, p. 318. Manfred Kienpointner, Alltagslogik, Struktur und Funktion von Argumentationsmustern. Stuttgart-Bad Cannstatt: Frommann-Holzboog, 1992, p.306."
    variables: [A,B]
    conclusions:
