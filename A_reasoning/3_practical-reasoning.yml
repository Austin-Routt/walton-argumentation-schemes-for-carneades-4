meta:
  title: "Reasoning - Practical Reasoning"
  version: "0.2.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  consequence_likelihood_adequate/2: "The assessed likelihood that action %s brings about outcome %s is adequate for the strength of this consequence argument."
  acceptable_action/2: "For %s, %s is an acceptable action."
  action_will_help/2: "Proposed action %s will really help %s."
  agent_bring_about/3: "If %s, as an agent, brings about %s, then %s will occur."
  alternative_action/3: "%s reasonably considers on the given information that bringing about at least one of %s is necessary to bring about %s."
  alternative_action_sufficient/3: "%s reasonably considers on the given information that each one of %s is sufficient to bring about %s."
  alternative_bad/2: "The respondent must bring about %s, or the proponent will undertake to see to it that %s will occur."
  alternative_means/3: "For %s, there are alternative means of realizing %s other than %s."
  alternative_means/2: "There are alternative means of realizing %s other than %s."
  alternatives/2: "Either you must bring about %s, or %s will occur."
  assert_bad/2: "I hereby assert that in fact I will see to it that %[2]s occurs if you bring about %[1]s."
  bad/1: "%s is bad."
  bad_consequence/2: "But, if you do not do %s, some consequence %s, which will be very bad for you, will occur, or is likely to occur."
  bad_for_goals/2: "%[2]s is a bad outcome, from the point of view of %[1]s's goals."
  bad_for_you/1: "%s is very bad for you."
  better_alternative_by_values/2: "In light of the values %[2]s, an alternative to %[1]s is better."
  bring_about_more_effectively/2: "There exists an action that would bring about %s more effectively than %s."
  brings_about/2: "The action %s brings about %s."
  can_be_case/2: "Either %s or %s can be the case."
  can_be_required/2: "Either %s or %s can be required."
  can_carry_out/2: "%s can carry out %s."
  choice_at/2: "There is a choice at %s between doing %s and not doing it."
  cited_bad_consequences/2: "If you bring about %s, some cited bad consequences, %s, will follow."
  conflicting_goals/2: "%s has other goals that might conflict with realizing %s."
  contributing_action/2: "Doing act %s contributes to goal %s."
  current_circumstances/1: "%s is the case in the current circumstances."
  danger/1: "%s is a danger to you."
  distress/1: "Individual %s is in distress, is suffering."
  easy_to_achieve/1: "%s is easy to achieve."
  ends_important/1: "%s should be regarded as highly important."
  feasible/1: "It is feasible to perform the action %s."
  future_losses_outweigh/1: "Future losses of completing the action %s outweigh its value."
  goal_of_agent/2: "The goal of %s is to bring about %s."
  goal_supported_by_values/2: "The goal %s is supported by the set of values %s."
  good/1: "%s is good."
  great_sacrifice/3: "If a great sacrifice %s has been made for %s, then the value %s of it will be greater."
  great_sacrifice_made/2: "A great sacrifice %s has been made for %s."
  great_side_effects/2: "There will be too great negative side effects of %s bringing about %s."
  help_needed/2: "If %[1]s needs help and giving help would not be too costly, then %[2]s ought to help."
  incompatible_consequences/2: "Bringing about %s has incompatible consequences with %s."
  incompatible_goal/1: "Another goal is incompatible with %s."
  intervening_actions/2: "Intervening actions are needed after performing %s to achieve %s."
  is_required/1: "%s is required."
  legitimate_value/1: "%s is a legitimate value."
  means_end/1: "Means %s should be regarded as an end."
  means_to_end/2: "%s is means to the end %s."
  more_acceptable_bringing/3: "For %s, bringing about %s is more acceptable than not bringing about %s."
  more_efficient_alternative/2: "Among the alternatives to %s, another would bring about %s more efficiently."
  more_important_ends/0: "Ends are more important than the means used to achieve them."
  necessary_action/4: "%s has selected member %s of %s as an acceptable, or as the most acceptable, necessary condition for %s."
  necessary_or_sufficient_for_goal/3: "Bringing about %[2]s is necessary or sufficient for %[1]s to bring about %[3]s."
  not_do_appear/2: "If you do not bring about %s, then %s will occur."
  not_doing/1: "You were considering not doing %s."
  not_too_costly/2: "%s's carrying out %s would not be too costly, that is, the negative side effects would not be too great."
  occur/2: "If the respondent brings about %s, then %s will occur."
  only_way_prevent/2: "But the only way for you to prevent %s is to bring about %s."
  other_actions_required/2: "Actions other than %[2]s are also required to bring about %[1]s."
  other_consequences/1: "There are other good or bad consequences of doing %s that should be taken into account."
  ought_to_bring_about/1: "You should (ought to, practically speaking) bring about %s."
  ought_to_continue/2: "%s ought to continue trying to realize %s."
