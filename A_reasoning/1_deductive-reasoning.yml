# Generated from walton.yml by tools/build_category_files.py. Do not edit:
# change walton.yml (or the grouping in categories.yml) and run the tool again.

meta:
  title: "Reasoning - Deductive Reasoning"
  version: "0.4.1"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  all_parts_property/2: "All the parts of %s have the property %s."
  divisionally_hereditary/2: "Property %[2]s is divisionally hereditary with regard to %[1]s: if the whole has it, every part has it."
  group_member/2: "%s is a member, idea, habit, custom, product or method of %s."
  group_member_quality/3: "If %s has %s, its members, ideas, habits, customs, products or methods %s will have it as well."
  has_property/2: "%s has property %s."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: group_2
    meta:
      title:  Argument From A Group and Its Members - Variant 2
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 21.2, p. 322. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 321-326."
    variables: [G,Q,M]
    conclusions: 
      - has_property(M,Q)
    premises: 
      - has_property(G,Q)
      - group_member(M,G)
      - group_member_quality(G,Q,M)

  - id: division_generic
    meta:
      title: Argument From Division - Generic Division
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 10.1, p. 317. Douglas Walton, Argument: The Logic of Fallacies, Toronto: McGraw-Hill Ryerson, 1982, pp.206-208."
    variables: [A,P]
    conclusions:
      - all_parts_property(A,P)
    premises:
      - has_property(A,P)
    assumptions: 
     - divisionally_hereditary(A,P)
