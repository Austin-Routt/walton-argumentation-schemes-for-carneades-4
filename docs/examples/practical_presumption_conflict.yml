# Generated by tools/graph_from_library.py from walton.yml (library 0.4.0): negative_practical, negative_practical_true.
meta:
  title: "Conflicting rankings in an explicit binary presumption issue"
  library: "0.4.0"
language:
  act_on_presumption_true/1: "I should act on the presumption that %s is true."
  act_on_presumption_false/1: "I act on the presumption that %s is not true."
  consequences_presumption/2: "If I act on the presumption that %s is true, and it is not true, consequences %s will follow."
  more_serious_consequences/2: "Consequences %s are more serious than consequences %s."
  not_know_true/1: "I do not know whether %s is true or not."
  other_consequences_presumption/2: "If I act on the presumption that %s is not true, and it is true, consequences %s will follow."
  presumption/1: "I have to act on the presumption that %s is true or not true."
  sufficient_evidence/1: "The search for evidence about whether %s is true has progressed sufficiently."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: negative_practical
    meta:
      title: Negative Practical Reasoning
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 26.2, p. 327. Douglas Walton, Arguments from Ignorance. University Park: Pennsylvania State University Press, 1996, pp. 84,86. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. p. 150."
    variables: [A,B,C]
    conclusions:
      - act_on_presumption_false(A)
    premises:
      - not_know_true(A)
      - presumption(A)
      - consequences_presumption(A,B)
      - other_consequences_presumption(A,C)
      - more_serious_consequences(B,C)
    assumptions: 
     - sufficient_evidence(A)

  - id: negative_practical_true
    meta:
      title: Negative Practical Reasoning - Act on the True Presumption
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 26.2, p. 327. Douglas Walton, Arguments from Ignorance. University
        Park: Pennsylvania State University Press, 1996, pp. 84,86. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. p. 150.'
    variables:
    - A
    - B
    - C
    conclusions:
    - act_on_presumption_true(A)
    premises:
    - not_know_true(A)
    - presumption(A)
    - consequences_presumption(A,B)
    - other_consequences_presumption(A,C)
    - more_serious_consequences(C,B)
    assumptions:
    - sufficient_evidence(A)

# --- the case ----------------------------------------------------------------
# Write the facts of the case below, one term per line (see docs/using.md):
#
# assumptions:            # what holds; premises and answers to questions
#   - expert(smith,law)
# questioned:             # assumptions of a scheme called into question
#   - credible(smith)
# issues:                 # optional: positions weighed under a proof standard
#   i1:
#     positions: [liable(acme), ¬liable(acme)]
#     standard: PE
# tests:                  # optional: the labels you expect
#   in: [liable(acme)]
# Binary-choice protocol: use only these two positive choice positions.
# Explicit negations of choice statements need a different dialogue model.
statements:
  act_on_presumption_true(door_unlocked): Act on the presumption that the door is unlocked.
  act_on_presumption_false(door_unlocked): Act on the presumption that the door is locked.
assumptions:
- not_know_true(door_unlocked)
- presumption(door_unlocked)
- consequences_presumption(door_unlocked,extra_check)
- other_consequences_presumption(door_unlocked,missed_departure)
- more_serious_consequences(missed_departure,extra_check)
- more_serious_consequences(extra_check,missed_departure)
issues:
  door_choice:
    positions:
    - act_on_presumption_false(door_unlocked)
    - act_on_presumption_true(door_unlocked)
    standard: PE
tests:
  out:
  - act_on_presumption_false(door_unlocked)
  - act_on_presumption_true(door_unlocked)
