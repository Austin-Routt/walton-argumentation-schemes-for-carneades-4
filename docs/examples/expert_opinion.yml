# Generated by tools/graph_from_library.py from walton.yml (library 0.4.1): expert_opinion.
meta:
  title: "Is Acme liable? An expert says so"
  library: "0.4.1"
language:
  asserts/2: "%s asserts that %s is true."
  based_on_evidence/1: "The assertion %v is based on evidence."
  credible/1: "%s is credible as an expert source."
  expert/2: "%s is an expert in the %s domain."
  in_domain/2: "%s is in the domain of %s."
  inconsistent_with_other_experts/1:  "%s is inconsistent with what other experts assert."
  untrustworthy/1: "%s is untrustworthy."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: expert_opinion
    meta:
      title: Argument from Expert Opinion
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 2, p. 310. Douglas Walton, Appeal to Expert Opinion, The Pennsylvania University Press, University Park, Albany, 1997, p.211-225."
    variables: [W,D,S]
    premises:
      - expert(W,D)
      - in_domain(S,D)
      - asserts(W,S)
    exceptions:
      - untrustworthy(W)
      - inconsistent_with_other_experts(S)
    assumptions:
      - credible(W)
      - based_on_evidence(asserts(W,S))
    conclusions:
      - S

# --- the case ----------------------------------------------------------------
# Write the facts of the case below, one term per line (see docs/using.md):
#
# assumptions:            # what holds; premises and answers to questions
#   - expert(smith,law)
# questioned:             # assumptions of a scheme called into question
#   - credible(smith)
# issues:                 # optional: positions weighed under a proof standard
#   i1:
#     positions: [liable(acme), ¬liable(acme)]
#     standard: PE
# tests:                  # optional: the labels you expect
#   in: [liable(acme)]
statements:
  liable(acme): Acme is liable.
assumptions:
  - expert(smith,law)
  - in_domain(liable(acme),law)
  - asserts(smith,liable(acme))
tests:
  in:
    - liable(acme)
