# Generated by tools/graph_from_library.py from walton.yml (library 0.2.0): practical_inference, negative_consequences_reasoning.
meta:
  title: "Should I take the job abroad?"
  library: "0.2.0"
language:
  agent_bring_about/3: "If %s, as an agent, brings about %s, then %s will occur."
  bad_for_goals/2: "%[2]s is a bad outcome, from the point of view of %[1]s's goals."
  conflicting_goals/2: "%s has other goals that might conflict with realizing %s."
  goal_of_agent/2: "The goal of %s is to bring about %s."
  incompatible_consequences/2: "Bringing about %s has incompatible consequences with %s."
  means_to_end/2: "%s is means to the end %s."
  more_efficient_alternative/2: "Among the alternatives to %s, another would bring about %s more efficiently."
  outcome_likely/2: "If %s is brought about, %s is strongly likely to occur."
  possible_bring_about/2: "It is possible for %s to bring about %s."
  possible_goal/1: "Bringing about %s is possible."
  should_do/2: "%s should do %s."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: practical_inference
    meta:
      title: Practical Reasoning - Practical Inference
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 22.1, p. 323. Trevor Bench-Capon, \"Persuasion in Practical Argument Using Value-based Argumentation Frameworks.\" Journal of Logic and Computation 13 (2003), pp. 429-448. Douglas Walton, Practical Reasoning. Savage, Md.: Rowman and Littlefield, 1990. Douglas Walton, \"Actions and Inconsistency: The Closure Problem of Practical Reasoning. \"In Contemporary Action Theory, vol.1 , ed. Ghita Holmstrom-Hintikka and Raimo Tuomela. Dordrecht: Kluwer, 1997, p. 164. Douglas Walton, Slippery Slope Arguments. Newport News, Va.: Vale Press, 1992, pp. 89-90."
    variables: [A,G,P]
    conclusions:
      - should_do(P,A)
    premises:
      - goal_of_agent(P,G)
      - means_to_end(A,G)
    exceptions:
      - conflicting_goals(P,G)
      - more_efficient_alternative(A,G)
      - incompatible_consequences(A,G)
    assumptions: 
     - possible_bring_about(P,A)
     - possible_goal(G)

  - id: negative_consequences_reasoning
    meta:
      title: Argument From Consequences - Reasoning From Negative Consequences
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 33.3, p. 332. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. pp. 155-156. Douglas Walton, Scare Tactics. Dordrecht: Kluwer, 2000, p. 123."
    variables: [A,B,P]
    conclusions:
      - ¬should_do(P,A)
    premises:
      - agent_bring_about(P,A,B)
      - bad_for_goals(P,B)
    assumptions:
      - outcome_likely(A,B)

# --- the case ----------------------------------------------------------------
# Write the facts of the case below, one term per line (see docs/using.md):
#
# assumptions:            # what holds; premises and answers to questions
#   - expert(smith,law)
# questioned:             # assumptions of a scheme called into question
#   - credible(smith)
# issues:                 # optional: positions weighed under a proof standard
#   i1:
#     positions: [liable(acme), ¬liable(acme)]
#     standard: PE
# tests:                  # optional: the labels you expect
#   in: [liable(acme)]
statements:
  should_do(me,take_job): I should take the job abroad.
  ¬should_do(me,take_job): I should not take the job abroad.
assumptions:
  - goal_of_agent(me,career)
  - means_to_end(take_job,career)
  - agent_bring_about(me,take_job,leave_family)
  - bad_for_goals(me,leave_family)
# Without the next two lines the two arguments weigh the same and neither
# position of the issue is in. Questioning the likelihood of the bad outcome
# leaves the argument against unsupported.
questioned:
  - outcome_likely(take_job,leave_family)
tests:
  in:
    - should_do(me,take_job)
  out:
    - ¬should_do(me,take_job)
