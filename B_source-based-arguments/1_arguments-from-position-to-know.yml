issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: position_to_know
    meta:
      title: Argument from Position to Know
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 1, p. 309. Douglas Walton, Legal Argumentation and Evidence, The Pennsylvania State University Press, University Park, 2002, p.46."
    variables: [W,D,S]
    conclusions: [S]
    premises:
      - position_to_know(W,D)
      - asserts(W,S)
      - in_domain(S,D)
    exceptions:
      - dishonest(W)

  - id: witness_testimony
    meta:
      title: Argument from Witness Testimony
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University
        Press, ch. 9, entry 3, p. 310. Douglas Walton, Henry Prakken, Chris Reed, Argumentation Schemes and Generalisations
        in Reasoning about Evidence, Proceedings of the 9th International Conference on Artificial Intelligence and
        Law, Edinburgh, 2003. New York: ACM Press 2003, pp. 35. Douglas Walton, Witness Testimony Evidence, Cambridge
        University Press, 2008.'
    variables:
    - W
    - D
    - S
    conclusions:
    - S
    premises:
    - position_to_know(W,D)
    - in_domain(S,D)
    - believes(W,S)
    - asserts(W,S)
    assumptions:
    - internally_consistent(S)
    exceptions:
    - inconsistent_with_known_facts(S)
    - inconsistent_with_other_witnesses(S)
    - witness_account_biased(W,S)
    - implausible(S)

  - id: position_to_know_ad_populum
    meta:
      title: Position to Know Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.2, p. 311."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)
      - position_to_know_group(G,A)

  - id: expert_opinion_ad_populum
    meta:
      title: Expert Opinion Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.3, p. 312."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)
      - expert_in_knowledge(G)

  - id: negative_normal_expectations
    meta:
      title: Negative Reasoning from Normal Expectations
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 26.1, p. 327. Douglas Walton, Arguments from Ignorance. University Park: Pennsylvania State University Press, 1996, pp. 84,86. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. p. 150."
    variables: [A]
    conclusions:
      - not_normal(A)
    premises:
      - normal_true(A)
      - ¬A
    exceptions:
      - uninvestigated(A)

  - id: negative_practical
    meta:
      title: Negative Practical Reasoning
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 26.2, p. 327. Douglas Walton, Arguments from Ignorance. University Park: Pennsylvania State University Press, 1996, pp. 84,86. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995. p. 150."
    variables: [A,B,C]
    conclusions:
      - act_on_presumption_false(A)
    premises:
      - not_know_true(A)
      - presumption(A)
      - consequences_presumption(A,B)
      - other_consequences_presumption(A,C)
      - more_serious_consequences(B,C)
    assumptions: 
