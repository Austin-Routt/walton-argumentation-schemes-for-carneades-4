# Generated from walton.yml by tools/build_category_files.py. Do not edit:
# change walton.yml (or the grouping in categories.yml) and run the tool again.

meta:
  title: "Source-based Arguments - Arguments Attacking Personal Credibility"
  version: "0.1.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  advocates_conclusion/3: "%s advocates argument %s, which has proposition %s as its conclusion."
  argument_not_accepted/2: "%s's argument %s should not be accepted."
  arguer_not_taken_both/2: "Arguer %s is less likely to have taken the evidence on both sides into account in arriving at conclusion %s."
  bad_character/1: "%s is a person of bad character."
  bad_not_accepted/2: "%s's argument %s should not be accepted."
  bias_relevant/2: "The type of dialogue in which %s arrived at %s is one in which being biased matters."
  biased/1: "Arguer %s is biased."
  biased_not_take_part/3: "Person %s's bias is a failure to honestly take part in a type of dialogue %s, that %s is part of."
  character_issue/1: "Character is an issue in the dialogue, and more specifically, %s's argument depends on his/her credibility."
  character_relevant/1: "In the type of dialogue in which argument %s was used, the issue of character is relevant."
  committed_opposite/2: "%s is personally committed to the opposite of %s, as shown by commitments expressed in her/his personal actions or personal circumstances expressing such commitments."
  credibility_questioned/1: "%s's credibility as a sincere person who believes in his own argument has been put into question by the two premises above."
  inconsistency_explained/2: "The practical inconsistency of the commitments of %s can be resolved or explained by further dialogue, so that it does not show a lack of credibility in arguing %s."
  inconsistency_relevant/2: "The pragmatic inconsistency of %s is a relevant reason for not accepting argument %s."
  morally_bad/1: "%s is a morally bad person."
  not_given_credibility/1: "%s should not be given as much credibility as it would have without the bias."
  not_taken_both/2: "If %s is biased, then it is less likely to have taken the evidence on both sides into account in arriving at conclusion %s."
  opposite_action/3: "%[1]s has carried out an action, or set of actions, that imply a personal commitment to %[3]s, contrary to argument %[2]s."
  plausibility_decreased/2: "The plausibility of %s's argument %s is decreased or destroyed."
  proponent_biased/2: "Person %s, the proponent of argument %s, is biased."
  strong_advocate/3: "%s advocates %s in a strong way, indicating her personal commitment to %s."
  stronger_than_character/1: "There is strong evidence that supports %s more than the character issue does."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: ad_hominem
    meta:
      title: Generic Ad Hominem
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 42, p. 336. Douglas Walton , Fundamentals of Critical Argumentation. Cambridge: Cambridge University Press, 2006, p. 123."
    variables: [A,S,C]
    conclusions:
      - bad_not_accepted(A,S)
    premises:
      - bad_character(A)
      - advocates_conclusion(A,S,C)
    exceptions:
      - stronger_than_character(S)
    assumptions: 
     - character_relevant(S)

  - id: pragmatic_inconsistency
    meta:
      title: Pragmatic Inconsistency
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 43, p. 336. Douglas Walton , Ad Hominem Arguments. Tuscaloosa: University of Alabama Press, 1998, pp. 218, 251."
    variables: [A,S,X]
    conclusions:
      - argument_not_accepted(A,S)
    premises:
      - advocates_conclusion(A,S,X)
      - opposite_action(A,S,¬X)
    assumptions: 
     - strong_advocate(A,S,X)
     - inconsistency_relevant(A,S)

  - id: circumstantial_ad_hominem
    meta:
      title: Circumstantial Ad Hominem
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 45, p. 337. Douglas Walton, Ad Hominem Arguments. Tuscaloosa: University of Alabama Press, 1998, pp. 255-256. Douglas Walton, Fundamentals of Critical Argumentation. Cambridge: Cambridge University Press, 2006, pp. 125-126."
    variables: [A,S,C]
    conclusions:
      - plausibility_decreased(A,S)
    premises:
      - advocates_conclusion(A,S,C)
      - committed_opposite(A,C)
      - credibility_questioned(A)
    assumptions: 
     - character_issue(A)
    exceptions:
     - inconsistency_explained(A,S)

  - id: bias
    meta:
      title: Argument From Bias
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 46, p. 338. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London : University of Alabama Press, 1995, p. 153."
    variables: [A,C]
    conclusions:
      - arguer_not_taken_both(A,C)
    premises:
      - not_taken_both(A,C)
      - biased(A)
    assumptions:
      - bias_relevant(A,C)

  - id: bias_ad_hominem
    meta:
      title: Bias Ad Hominem
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 47, p. 338. Douglas Walton, Ad Hominem Arguments. Tuscaloosa: University of Alabama Press, 1998, p.255."
    variables: [A,S,D]
    conclusions:
      - not_given_credibility(S)
    premises:
      - proponent_biased(A,S)
      - biased_not_take_part(A,D,S)
      - morally_bad(A)
