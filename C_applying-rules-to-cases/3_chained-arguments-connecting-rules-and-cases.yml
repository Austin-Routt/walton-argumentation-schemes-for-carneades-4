meta:
  title: "Applying Rules to Cases - Chained Arguments Connecting Rules and Cases"
  version: "0.1.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  all_has/3: "If %s has %s, then %s has it too."
  beyond_contetion/2: "It is clearly beyond contention that %s has %s."
  cannot_be_exception/2: "Case %s cannot be judged to be an exception to the rule %s."
  claimed_exception/2: "Case %s is claimed to be an exception to the rule %s, an excusable or exceptional case."
  individual_property/2: "Individual %s has property %s."
  individual_property_false/2: "But quite clearly it is false that %s has %s."
  individuals_propoerty/3: "If %s has %s, then %s has it too."
  intolerable_exception/2: "Treating case %s as an exception to the rule %s would be intolerable."
  may_have/2: "%s may have %s, for all we know or can prove."
  must_proper/2: "The conditional 'if %s then %s' is not, by itself, acceptable to the respondent, nor are shorter sequences acceptable to the respondent."
  not_has_propery/2: "Therefore, you can't truly say that %s has %s."
  precedent_series/3: "By case-to-case consistency, holding case %s to be an exception to the rule %s binds us to hold each case of a sequence of similar cases, up to %s, to be an exception too."
  proper_sequence/0: "The sequence of propositions is dealt with in the appropriate order."
  reapplication_sequence/3: "A sequence of modus ponens subarguments leads from %s, in the clear area, through the grey area to %s, for the property %s."
  sequence/4: "There is an intervening sequence of propositions, %s, %s,...,%s, %s such that the conditionals must be in proper order."
  true_acceptable/1: "Proposition %s is true, acceptable to the respondent."
  vague_property/3: "Property %s is vague, and so generally, if %s has it, then you can't deny that the next closely neighboring individual %s has it."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: gradualism
    meta:
      title: Argument From Gradualism
      source: >
             Douglas Walton, Argumentation Schemes for Presumptive Reasoning. 
             Mahwah, N.J.: Erlbaum, 1996, p. 96.
    variables: [P1,P2,P3,P4]
    conclusions:
      - true_acceptable(P4)
    premises:
      - true_acceptable(P1)
      - sequence(P1,P2,P3,P4)
      - must_proper(P1,P4)
    assumptions: 
     - proper_sequence

  - id: precedent_slippery_slope
    meta:
      title: Precedent Slippery Slope Argument
      source: >
            Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008).  Argumentation Schemes. Cambridge University Press, p. 340.
    variables: [C,R,N]
    conclusions:
      - cannot_be_exception(C,R)
    premises:
      - claimed_exception(C,R)
      - precedent_series(C,R,N)
      - intolerable_exception(C,R)

  - id: sorites_slippery_slope
    meta:
      title: Sorites Slippery Slope Argument
      source: >
             Douglas Walton, "The Argument of the Beard." Informal Logic 18 (1996), p. 151.
    variables: [A,P,A1,A2]
    conclusions:
      - may_have(A,P)
    premises:
      - beyond_contetion(A2,P)
      - all_has(A2,P,A1)
      - reapplication_sequence(A2,A,P)

  - id: verbal_slippery_slope
    meta:
      title: Verbal Slippery Slope
      source: >
             Douglas Walton, A Pragmatic Theory of Fallacy. 
             Tuscaloosa and London: University of Alabama Press, 1995, p. 160.
    variables: [A1,A2,A,P,F]
    conclusions:
      - not_has_propery(A1,P)
    premises:
      - individual_property(A1,P)
      - individuals_propoerty(A1,F,A2)
      - vague_property(P,A1,A)
      - individual_property_false(A,P)
