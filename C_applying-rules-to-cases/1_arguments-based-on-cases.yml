meta:
  title: "Applying Rules to Cases - Arguments Based on Cases"
  version: "0.2.0"
  source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press."
language:
  action_rule_excuse/4: "Case %s supplies an exception, extenuating circumstance or excuse under rule %s for actor %s's noncompliance with action %s."
  conflicting_action_rule/4: "In case %s, an established rule conflicts with or overrides rule %s for actor %s and action %s."
  established_action_warrant/4: "In case %s, established rule %s obliges actor %s to perform included action %s unless a relevant exception applies."
  established_action_rule/4: "In case %s, rule %s is established for actor %s and requires action %s as an instance of its action types."
  contrary_similar_case/2: "Claim %[1]s has the opposite truth value in another case similar to base case %[2]s; this is supported counterexample evidence for this analogy, without requiring greater similarity."
  should_refrain/2: "%s should refrain from doing %s."
  conflicting_or_overriding_rule/2: "Another established rule conflicts with or overrides rule %s in its application to conclusion %s."
  rule_exception_or_excuse/2: "An exceptional case or an adequate excuse defeats rule %s in its application to conclusion %s."
  applicable/1: "Argument %s is applicable."
  carry_out_act/2: "%s carries out action %s."
  carry_out_right/2: "The right thing to do in %s is carry out %s."
  carry_out_wrong/2: "The wrong thing to do in %s is carry out %s."
  exemplify/1: "To have a %s image -an image of a perceptible property- is a prima facie reason to believe that the circumstances exemplify it."
  has_conclusion/2: "Rule %s has conclusion %s."
  has_properties/3: "In this particular case, the individual %s has property %s and also property %s."
  image/2: "Person %s has a %s image -an image of a perceptible property-."
  impair_general/1: "Special circumstances of example %s impair its generalizability."
  in_case/2: "%s is true in case %s."
  inapplicable_rule/1: "Rule %s is inapplicable in this case."
  must_do/2: "%s must do %s."
  not_indicator/2: "Under the circumstances of %s's perception, an image of %s is not a reliable indicator of that proposition."
  prestigious_individual/2: "Individual %s is prestigious for -admired by- individuals %s."
  reasonable_believe/1: "It is reasonable to believe %s."
  relevant_differences/1: "There are relevant differences between case %s and the current case."
  relevant_differences/2: "There are relevant differences between case %s and case %s."
  right_to_do/2: "The right thing to do in %s, was to carry out action %s."
  rule_of_case/2: "Rule %s is the ratio decidendi of case %s."
  should_do/2: "%s should do %s."
  similar_case/1: "Case %s is similar to the current case."
  similar_to/2: "%s is similar to %s."
  supports_generalization/3: "Example %s supports the generalization that whatever has property %s also has property %s."
  typical_example/1: "Example %s is a typical example of the kinds of cases the generalization covers."
  usually_properties/2: "Usually, if something has property %s, it also has property %s."
  valid/1: "Rule %s is valid."
  valid_rule/2: "The rule that whatever has property %s also has property %s is valid."
  want_to_be_different/2: "%s wants to be different from %s."
  imitation_warrant/3: "If %s carries out action %s, that action is worth being imitated by %s."
  wrong_to_do/2: "The wrong thing to do in %s, was to carry out action %s."

issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: exeption_to_rule
    meta:
      title: Argument From Exception to a Rule
      source: "Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, p. 148"
    variables: [S,C,R]
    conclusions: [S]
    premises:
      - similar_case(C)
      - rule_of_case(R,C)
      - has_conclusion(R,S)
    exceptions:
      - relevant_differences(R,C)
      - inapplicable_rule(R)

  - id: from_example
    meta:
      title: Argument From Example
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.1, p. 314. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995, p. 135."
    variables: [A,P1,P2]
    conclusions:
      - usually_properties(P1,P2)
    premises:
      - has_properties(A,P1,P2)
    exceptions:
      - impair_general(A)
    assumptions: 
      - typical_example(A)
      - supports_generalization(A,P1,P2)

  - id: illustration
    meta:
      title: Argument From Illustration
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.2, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 357-368."
    variables: [Y,P1,P2]
    conclusions:
      - valid_rule(P1,P2)
    premises:
      - usually_properties(P1,P2)
      - has_properties(Y,P1,P2)

  - id: from_model
    meta:
      title: Argument From Model
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.3, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 357-368."
    variables: [A,B,X]
    conclusions:
      - should_do(B,X)
    premises:
      - prestigious_individual(A,B)
      - carry_out_act(A,X)
      - imitation_warrant(A,X,B)

  - id: from_antimodel
    meta:
      title: Argument From Anti-Model
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press,
        ch. 9, entry 6.4, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame,
        Ind.: University of Notre Dame Press, 1969, pp. 357-368.'
    variables:
    - A
    - B
    - X
    conclusions:
    - should_refrain(B,X)
    premises:
    - ¬prestigious_individual(A,B)
    - carry_out_act(A,X)
    - want_to_be_different(B,A)

  - id: practical_analogy_positive
    meta:
      title: Practical Reasoning From Analogy - Positive Schema
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 8.1, p. 316. Douglas Walton, Informal Logic. New York: Cambridge University Press, 1989. p.257."
    variables: [A1,A2,X]
    conclusions:
      - carry_out_right(A2,X)
    premises:
      - right_to_do(A1,X)
      - similar_to(A1,A2)

  - id: practical_analogy_negative
    meta:
      title: Practical Reasoning From Analogy - Negative Schema
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 8.2, p. 316. Douglas Walton, Informal Logic. New York: Cambridge University Press, 1989. p.257."
    variables: [A1,A2,X]
    conclusions:
      - carry_out_wrong(A2,X)
    premises:
      - wrong_to_do(A1,X)
      - similar_to(A1,A2)

  - id: perception
    meta:
      title: Argument From Perception
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University
        Press, ch. 9, entry 59.1, p. 345. John Pollock, Cognitive Carpentry. Cambridge, Mass.: MIT Press, 1995, p. 53.'
    variables:
    - P
    - I
    conclusions:
    - reasonable_believe(I)
    premises:
    - image(P,I)
    - exemplify(I)
    exceptions:
