  - id: established_rule
    meta:
      title: Argument from an Established Rule
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 55.1, p. 343. Douglas Walton, A Pragmatic Theory of Fallacy, The University of Alabama Press, Tuscaloosa and London, 1995, p. 147."
    variables: [C,R]
    conclusions: [C]
    premises:
