issue_schemes:
  # A statement and its explicit negation are the two positions of one issue,
  # weighed under its proof standard (PLAN.md 3.9, D10; docs/contracts.md,
  # contract 4). A graph that assumes both is an inconsistent context.
  negation: ["S", "¬S"]

argument_schemes:
  - id: popular_opinion
    meta:
      title: Argument From Popular Opinion
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4, p. 311. Douglas Walton, Fundamentals of Critical Argumentation. New York: Cambridge University Press, 2006, p. 91. Douglas Walton, Informal Logic. New York: Cambridge University Press, 1989, p. 89. Douglas Walton, Appeal to Popular Opinion. University Park: Pennsylvania State University Press, 1999, pp. 223-226."
    variables: [A]
    conclusions:
      - reason_in_favor(A)
    premises:
      - generally_true(A)
      - favor(A)
    exceptions:
      - doubting_general(A)
      
  - id: pop_scheme
    meta:
      title: Pop Scheme
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.1, p. 311."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)

  - id: pop_scheme_acceptance
    meta:
      title: Pop Scheme (the reading that you should accept A)
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.1, p. 311."
    variables: [A,G]
    conclusions:
      - should_accept(A)
    premises:
      - group_accepted(G,A)
      
  - id: position_to_know_ad_populum
    meta:
      title: Position to Know Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.2, p. 311."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)
      - position_to_know_group(G,A)

  - id: expert_opinion_ad_populum
    meta:
      title: Expert Opinion Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.3, p. 312."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)
      - expert_in_knowledge(G)

  - id: deliberation_ad_populum 
    meta:
      title: Deliberation Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.4, p. 312."
    variables: [A,G]
    conclusions:
      - A
    premises:
      - group_accepted(G,A)
      - deliberate(G,A)

  - id: moral_justification_ad_populum
    meta:
      title: Moral Justification Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.5, p. 312."
    variables: [G,P]
    conclusions:
      - should_accept(P)
    premises:
      - good_group(G,P)
      - goal_good_group(G)
      
  - id: moral_justification_ad_populum_excuse
    meta:
      title: Moral Justification Ad Populum Argument Excuse Subtype
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.6, p. 312."
    variables: [G,X,A]
    conclusions:
      - morally_acceptable_action(X,A)
    premises:
      - group_does(G,X,A)
      - acceptable_norm(X,A,G)
      - group_member(G)
 
  - id: snob_appeal_ad_populum
    meta:
      title: Snob Appeal Ad Populum Argument
      source: Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.7, p. 312.
    variables:
    - A
    - G
    - O
    - P
    conclusions:
    - should_accept(A)
    premises:
    - property_or_object(G,A)
    - group_accepted(G,A)
    - elite_group(G)
    - goal_prestige
    - accept_property_object(A,P,O,G)

  - id: appeal_to_vanity_ad_populum
    meta:
      title: Appeal to Vanity Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.8, p. 312."
    variables: [G,A,X]
    conclusions:
      - ought_to_bring_about(X)
    premises:
      - admired_people(G,A)
      - group_action(X,G)

  - id: rhetoric_ad_populum
    meta:
      title: Rhetoric of Belonging Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.9, p. 313."
    variables: [G,A]
    conclusions:
      - should_accept(A)
    premises:
      - group_accepted(G,A)
      - valued_to_be_member(G)
      - out_group_not_accept(A,G)
      
  - id: common_folk_ad_populum 
    meta:
      title: Common Folks Ad Populum Argument
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.10, p. 313."
    variables: [S]
    conclusions:
      - being_credible(S)
    premises:
      - background(S)

  - id: common_folks_group_ad_populum
    meta:
      title: Common Folks Ad Populum Group Subtype
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 4.11, p. 313."
    variables: [G,S]
    conclusions:
      - accept_saying(S)
    premises:
      - group_background(S,G)
      - respondent_member(G)
      
  - id: popular_practice
    meta:
      title: Argument From Popular Practice
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press,
        ch. 9, entry 5, p. 314. Douglas Walton , Fundamentals of Critical Argumentation. New York: Cambridge University Press,
        2006, p. 93.'
    variables:
    - A
    - C
    conclusions:
    - acceptable_in_case(C,A)
    premises:
    - popular_practice(C,A)
    - to_think_acceptable(C,A)
    assumptions:
    - have_grounds_think(C,A)

  - id: from_example
    meta:
      title: Argument From Example
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.1, p. 314. Douglas Walton, A Pragmatic Theory of Fallacy. Tuscaloosa and London: University of Alabama Press, 1995, p. 135."
    variables: [A,P1,P2]
    conclusions:
      - usually_properties(P1,P2)
    premises:
      - has_properties(A,P1,P2)
    exceptions:
      - impair_general(A)
    assumptions: 
      - typical_example(A)
      - supports_generalization(A,P1,P2)
     
  - id: illustration
    meta:
      title: Argument From Illustration
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.2, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 357-368."
    variables: [Y,P1,P2]
    conclusions:
      - valid_rule(P1,P2)
    premises:
      - usually_properties(P1,P2)
      - has_properties(Y,P1,P2)

  - id: from_model
    meta:
      title: Argument From Model
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 6.3, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame, Ind.: University of Notre Dame Press, 1969, pp. 357-368."
    variables: [A,B,X]
    conclusions:
      - should_do(B,X)
    premises:
      - prestigious_individual(A,B)
      - carry_out_act(A,X)
      - imitation_warrant(A,X,B)

  - id: from_antimodel
    meta:
      title: Argument From Anti-Model
      source: 'Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press,
        ch. 9, entry 6.4, p. 315. Ch. Perelman and L. Olbrechts-Tyteca, The New Rhetoric: A Treatise on Argumentation. Notre Dame,
        Ind.: University of Notre Dame Press, 1969, pp. 357-368.'
    variables:
    - A
    - B
    - X
    conclusions:
    - should_refrain(B,X)
    premises:
    - ¬prestigious_individual(A,B)
    - carry_out_act(A,X)
    - want_to_be_different(B,A)

  - id: practical_analogy_positive
    meta:
      title: Practical Reasoning From Analogy - Positive Schema
      source: "Walton, Douglas and Reed, Chris and Macagno, Fabrizio (2008). Argumentation Schemes. Cambridge University Press, ch. 9, entry 8.1, p. 316. Douglas Walton, Informal Logic. New York: Cambridge University Press, 1989. p.257."
    variables: [A1,A2,X]
    conclusions:
      - carry_out_right(A2,X)
    premises:
      - right_to_do(A1,X)
      - similar_to(A1,A2)
      
