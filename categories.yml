# Which schemes of walton.yml go into which category file. The category files
# are generated from walton.yml and this file by tools/build_category_files.py;
# the grouping follows Walton, Reed & Macagno (2008), Argumentation Schemes.
# Every scheme of walton.yml must be listed exactly once.

A_reasoning/1_deductive-reasoning.yml:
  title: Reasoning - Deductive Reasoning
  schemes: [group_2, division_generic]

A_reasoning/2_inductive-reasoning.yml:
  title: Reasoning - Inductive Reasoning
  schemes: [group_1, composition_generic, part_in_whole, part_in_whole_physical,
            part_in_whole_species_degree, part_in_whole_physical_degree,
            part_in_whole_smaller_degree, whole_into_parts,
            whole_into_parts_selected, whole_into_parts_negative]

A_reasoning/3_practical-reasoning.yml:
  title: Reasoning - Practical Reasoning
  schemes: [practical_reasoning1, practical_reasoning2, practical_reasoning_as1,
            practical_reasoning_as1_demotion, practical_reasoning_as1_preclusion,
            practical_reasoning_as2, practical_reasoning_as2_demotion, negative_consequences,
            positive_consequences, alternative_cognitive, alternative_normative,
            sacrifice, sacrifice_small, practical_inference, practical_necessary_condition,
            practical_sufficient_condition, value_based_practical_reasoning,
            practical_goal, end_and_means_1, end_and_means_bad, end_and_means_less_bad,
            end_and_means_2, end_and_means_reverse, end_and_means_3, end_and_means_difficult, two_person_practical, waste,
            negative_consequences_prudential, pragmatic_alternative, threat,
            ad_baculum, fear, danger, help, distress,
            negative_consequences_reasoning, sunk_costs,
            sunk_costs_precommitment]

