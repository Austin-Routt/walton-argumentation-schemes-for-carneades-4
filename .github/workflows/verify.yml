# The verification gate of PLAN.md (D7): the engines' own unit tests, the two
# Python checks of the scheme files, a check of the engine sources against
# their archives, and the suite in tools/vv, which runs the engine in
# third_party/ on every scheme.
#
# The run is strict (VV_STRICT=1, the release gate of PLAN.md): every check
# has to pass, a check listed in tools/vv/known_issues.yml included. The
# ledger is empty since Phase 4, so the ordinary and the strict run agree.
# The job "toolchains" compares the results of the two Go versions check by
# check (PLAN.md Phase 6).
name: verify
on:
  push:
  pull_request:
jobs:
  vv:
    name: tools/vv (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.informational }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: "1.24"       # the version the suite and its ledger were measured with
            informational: false
          - go: "stable"     # early warning of toolchain changes; does not block
            informational: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y graphviz unzip
      - name: tools/vv/engine-tests.sh (the engines' own unit tests)
        env:
          GOFLAGS: -mod=mod
        run: tools/vv/engine-tests.sh
      - name: tools/vv/run.sh
        env:
          GOFLAGS: -mod=mod
          VV_STRICT: "1"
          VV_RESULTS: ${{ github.workspace }}/vv-results.jsonl
        run: tools/vv/run.sh
      - run: go version | tee go-version.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vv-results-go-${{ matrix.go }}
          path: |
            vv-results.jsonl
            go-version.txt
          if-no-files-found: ignore
  toolchains:
    name: the two Go versions agree check by check
    needs: vv
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true   # like the stable job: an early warning, not a gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: |
          cat results/vv-results-go-1.24/go-version.txt results/vv-results-go-stable/go-version.txt
          python3 tools/vv/compare_results.py results/vv-results-go-1.24/vv-results.jsonl results/vv-results-go-stable/vv-results.jsonl
